<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>루메아카이브·온살 광고 집행 보고서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F6; --card:#FFFFFF; --ink:#191F28; --ink2:#4E5968; --ink3:#8B95A1; --line:#E5E8EB;
  --accent:#E6007E; --accent-soft:#FDE8F3;
  --up:#F04452; --down:#3182F6;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;letter-spacing:-0.01em}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 56px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1040px;margin:0 auto;padding:14px 16px 0}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title{font-size:18px;font-weight:900;letter-spacing:-0.03em}
.title i{font-style:normal;color:var(--accent)}
.asof{font-size:12px;color:var(--ink3)}
.tabs{display:flex;gap:4px;margin-top:12px}
.tab{appearance:none;border:0;background:none;padding:10px 14px 12px;font:inherit;font-size:15px;font-weight:700;color:var(--ink3);cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab small{font-size:11px;font-weight:500;padding:2px 7px;border-radius:99px;background:var(--bg);color:var(--ink3)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab.on small{background:var(--accent-soft);color:var(--accent)}

.sample{margin-top:16px;background:#FFF8E1;border:1px solid #FFE08A;color:#7A5B00;border-radius:12px;padding:10px 14px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.sample b{font-weight:700}
.sample.real{background:#EAF6EF;border-color:#BFE3CE;color:#0F5B38}

/* section head */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0 14px}
.hero h2{font-size:22px;font-weight:900;letter-spacing:-0.03em}
.hero p{color:var(--ink3);font-size:13px;margin-top:2px}
.seg{display:inline-flex;background:#E9EBEE;border-radius:10px;padding:3px}
.seg button{appearance:none;border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--ink3);padding:6px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.card{background:var(--card);border-radius:var(--radius);padding:20px}
.sec-t{font-size:16px;font-weight:700;margin:28px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-t span{font-size:12px;font-weight:400;color:var(--ink3)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--card);border-radius:var(--radius);padding:16px 16px 14px}
.kpi .l{font-size:12.5px;color:var(--ink3);font-weight:500}
.kpi .v{font-size:22px;font-weight:900;margin-top:6px;letter-spacing:-0.03em;white-space:nowrap}
.kpi .v em{font-style:normal;font-size:13px;font-weight:500;color:var(--ink2);margin-left:2px}
.kpi .d{font-size:12px;margin-top:4px;font-weight:500}
.kpi.main{background:var(--ink);}
.kpi.main .l{color:#AEB5BE}.kpi.main .v,.kpi.main .v em{color:#fff}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--ink3)}
.kpi.main .d.up{color:#FF8A94}.kpi.main .d.down{color:#8FBAFF}

/* funnel */
.funnel{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.funnel .st .l{font-size:12.5px;color:var(--ink3)}
.funnel .st .v{font-size:20px;font-weight:900;margin-top:2px}
.funnel .ar{color:var(--ink3);font-size:12px;line-height:1.3}
.funnel .ar b{display:block;color:var(--accent);font-size:14px}
.bar3{height:8px;border-radius:99px;background:var(--bg);margin-top:16px;overflow:hidden;display:flex}
.bar3 i{display:block;height:100%}

/* chart */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{appearance:none;border:1px solid var(--line);background:var(--card);font:inherit;font-size:12.5px;font-weight:500;color:var(--ink2);padding:5px 12px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chart-box{position:relative}
.chart-box svg{display:block;width:100%;height:260px;overflow:visible}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.5;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5;transform:translate(-50%,-100%)}
.tt b{display:block;font-weight:700;margin-bottom:2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink3);margin-top:8px}
.legend i{display:inline-block;width:14px;height:0;border-top:2.5px solid var(--accent);vertical-align:middle;margin-right:5px}
.legend i.p{border-top:2px dashed #B0B8C1}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:12px;font-weight:500;color:var(--ink3);text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
th.on{color:var(--ink);font-weight:700}
th .ar{font-size:10px;margin-left:2px}
td{padding:12px 8px;text-align:right;border-bottom:1px solid #F2F4F6;white-space:nowrap;font-size:13.5px}
tr:last-child td{border-bottom:0}
td.nm{font-weight:700;white-space:normal;min-width:150px}
td.nm small{display:block;font-weight:400;color:var(--ink3);font-size:11.5px}
.rk{display:inline-flex;width:22px;height:22px;border-radius:7px;background:var(--bg);color:var(--ink2);align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-right:8px}
.rk.t{background:var(--accent);color:#fff}
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.bd.s{background:var(--accent-soft);color:var(--accent)}
.bd.h{background:#EEF0F3;color:var(--ink2)}
.bd.x{background:#FEF3C7;color:#92400E}
.minibar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-right:6px;opacity:.85}

/* insights */
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.in{background:var(--card);border-radius:var(--radius);padding:18px}
.in .tag{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);display:inline-block;padding:2px 9px;border-radius:99px}
.in h4{font-size:15px;font-weight:700;margin:10px 0 4px;line-height:1.4}
.in p{font-size:13px;color:var(--ink2)}

.foot{margin-top:32px;font-size:12px;color:var(--ink3);line-height:1.7}
.foot b{color:var(--ink2)}

/* thumbs */
.nmw{display:flex;align-items:center;gap:10px}
.th{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:#EEF0F3;border:1px solid var(--line)}
.th.ph{display:flex;align-items:center;justify-content:center;color:#B0B8C1;font-size:18px}
.gseg{margin-left:auto}
/* notes */
.nt-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:28px 0 12px}
.nt-head h3{font-size:16px;font-weight:700}
.nt-head .meta{font-size:12px;color:var(--ink3);margin-top:2px}
.btn{appearance:none;border:0;font:inherit;font-size:13px;font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer}
.btn.pri{background:var(--accent);color:#fff}
.btn.sec{background:#E9EBEE;color:var(--ink2)}
.btn:disabled{opacity:.5;cursor:default}
.nt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nt{background:var(--card);border-radius:var(--radius);padding:18px}
.nt.full{grid-column:1/-1}
.nt h4{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nt h4 i{font-style:normal;font-size:11.5px;padding:2px 9px;border-radius:99px}
.nt h4 i.a{background:var(--accent-soft);color:var(--accent)}
.nt h4 i.g{background:#E8F5EE;color:#0F7B4B}
.nt h4 i.w{background:#FEF3C7;color:#92400E}
.nt h4 i.k{background:#EEF0F3;color:var(--ink2)}
.nt .txt{white-space:pre-wrap;word-break:keep-all;color:var(--ink);font-size:13.5px;line-height:1.7}
.nt .empty{color:var(--ink3);font-size:13px}
.nt textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:13.5px;line-height:1.6;color:var(--ink);background:#FAFBFC}
.nt textarea:focus,.ar-row input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.ar-list{display:flex;flex-direction:column;gap:8px}
.ar-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.ar-item .ck{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid #CBD1D8;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:1px}
.ar-item.done .ck{background:var(--accent);border-color:var(--accent)}
.ar-item.done .tx{color:var(--ink3);text-decoration:line-through}
.ar-item .tx{font-size:13.5px;font-weight:500;flex:1}
.ar-item .mt{font-size:12px;color:var(--ink3);white-space:nowrap}
.ar-row{display:grid;grid-template-columns:auto 1fr 110px 130px auto;gap:8px;align-items:center}
.ar-row input[type=text],.ar-row input[type=date]{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;background:#FAFBFC;min-width:0;width:100%}
.ar-row input[type=checkbox]{width:18px;height:18px;accent-color:#E6007E}
.ar-row button{appearance:none;border:0;background:none;color:var(--ink3);font-size:18px;cursor:pointer;padding:0 6px}
.nt-msg{font-size:12.5px;margin-top:10px;color:var(--ink3)}
.is-list{display:flex;flex-direction:column;gap:8px}
.is-item{background:var(--card);border-radius:var(--radius);padding:14px 18px;display:flex;gap:14px;align-items:flex-start}
.is-d{flex:none;width:74px;font-size:13px;font-weight:700;color:var(--ink2);padding-top:2px}
.is-b{flex:1;min-width:0}
.is-t{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.is-t i{font-style:normal;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:#EEF0F3;color:var(--ink2)}
.is-t i.c0{background:var(--accent-soft);color:var(--accent)}
.is-t i.c1{background:#FEE2E2;color:#B42318}
.is-t i.c2{background:#E8F5EE;color:#0F7B4B}
.is-t i.c3{background:#E0ECFF;color:#1D4ED8}
.is-t i.c4{background:#FEF3C7;color:#92400E}
.is-b .txt{white-space:pre-wrap;word-break:keep-all;font-size:13.5px;line-height:1.7;margin-top:6px;color:var(--ink)}
.txt .bl{display:flex;gap:7px;margin-top:4px;white-space:normal}
.txt .bl>span:first-child{flex:none;color:var(--ink3)}
.txt .bl>span:last-child{flex:1;min-width:0}
.txt .bh{font-size:12.5px;font-weight:700;color:var(--ink2);margin-top:12px;white-space:normal}
.txt .bh:first-child{margin-top:0}
.txt .bp{margin-top:4px;white-space:normal}
.txt{white-space:normal}
.is-grp{font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 2px 2px;display:flex;align-items:center;gap:8px}
.is-grp:first-child{margin-top:0}
.is-grp em{font-style:normal;font-weight:400;color:var(--ink3)}
.is-imgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.is-im{width:104px}
.is-im img{width:104px;height:104px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#EEF0F3;display:block}
.is-im span{display:block;font-size:11px;line-height:1.35;color:var(--ink3);margin-top:4px;word-break:keep-all}
.is-a{flex:none;display:flex;gap:2px}
.is-a button{appearance:none;border:0;background:none;font:inherit;font-size:12px;color:var(--ink3);cursor:pointer;padding:4px 6px;border-radius:6px}
.is-a button:hover{background:var(--bg);color:var(--ink)}
.is-form{margin-bottom:10px}
.is-form .row{display:grid;grid-template-columns:150px 150px 1fr;gap:8px;margin-bottom:8px}
.is-form input,.is-form select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:13.5px;background:#FAFBFC;min-width:0;width:100%}
.is-form input:focus,.is-form select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.is-form textarea{min-height:84px}
.is-form .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
@media(max-width:640px){.is-form .row{grid-template-columns:1fr}.is-item{flex-wrap:wrap}.is-d{width:auto}}

.nt-msg.err{color:#C0362C}
@media(max-width:760px){
  .nt-grid{grid-template-columns:1fr}
  .ar-row{grid-template-columns:auto 1fr auto;}
  .ar-row input[type=text].ow,.ar-row input[type=date]{grid-column:2/3}
}
@media(max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .ins{grid-template-columns:1fr}
  .kpi .v{font-size:19px}
  .hero h2{font-size:19px}
  .card{padding:16px}
  .funnel .st .v{font-size:16px}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="title-row">
      <div class="title">광고 집행 보고서 <i>●</i></div>
      <div class="asof num" id="asof"></div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-b="lume">루메아카이브 <small>Meta</small></button>
      <button class="tab" data-b="onsal">온살 <small>당근마켓</small></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="sample" id="banner"></div>
  <div id="view"></div>

</main>

비슷했음.", "bad": "[나이아신 세럼 10]\n• 클릭률 0.62%로 가장 낮고, 클릭 15회 중 상세페이지 조회는 5회(33%). 광고비 3.7천원이라 표본이 적어 판단 보류.\n[구매 0건]\n• 장바구니 4회가 구매로 이어지지 않았음. 집행 3일차라 데이터가 더 쌓여야 함.\n[시사점]\n• 노출이 앞선 두 소재에 몰려서 나이아신 10은 비교할 만큼 데이터가 모이지 않았음.", "actions": [{"t": "11/17 구매·장바구니 변동 확인 (구매 0건이 이어지는지)", "owner": "", "due": "2026-11-17", "done": false}, {"t": "일별 추이 반영을 위해 날짜별(11/13~) 당근 데이터 캡처 또는 CSV 전달", "owner": "", "due": "2026-11-17", "done": false}, {"t": "타겟 등 세부 세팅을 이슈 로그에 기록", "owner": "", "due": "2026-11-17", "done": false}, {"t": "클릭 약 500회 또는 3일 더 쌓인 뒤 소재별 판단 (나이아신 10 유지·중단, 노출 편중 점검)", "owner": "", "due": "2026-11-19", "done": false}, {"t": "당근 구매 전환 측정이 정상 연결돼 있는지 확인 (장바구니는 잡히는데 구매 0건)", "owner": "", "due": "2026-11-18", "done": false}, {"t": "이미지 A/B 재테스트: 같은 제품(나이아신 20 또는 펩타이드)에 당근 맞춤 이미지 vs 제품 컷 2종, 소재당 클릭 100회 이상 쌓인 뒤 비교", "owner": "", "due": "2026-11-19", "done": false}], "updated": "2026-11-16T16:35:00+09:00"}}</script>
<script>
/* ============ 샘플 데이터 생성 (실데이터 교체 지점) ============
   creatives[].days = 최근 60일(오래된 순) 배열: {spend, imp, clk, conv, rev}
   실데이터를 넣으려면 아래 gen() 대신 같은 형태의 배열을 넣으면 됩니다. */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DAYS=60, END=new Date(2026,10,10);
function gen(seed,o){
  const r=rng(seed),days=[];
  for(let i=0;i<DAYS;i++){
    const d=new Date(END);d.setDate(END.getDate()-(DAYS-1-i));
    const wk=[0.92,1.0,1.02,1.04,1.06,1.12,0.98][d.getDay()];
    const trend=1+o.trend*(i/DAYS);
    const spend=Math.round(o.spend*wk*trend*(0.82+0.36*r())/100)*100;
    const imp=Math.round(spend/o.cpm*1000*(0.92+0.16*r()));
    const clk=Math.round(imp*o.ctr*(0.88+0.24*r()));
    const conv=Math.round(clk*o.cvr*(0.65+0.7*r()));
    const rev=Math.round(conv*o.aov*(0.9+0.2*r())/100)*100;
    days.push({spend,imp,clk,conv,rev});
  }

function smoothPath(pts){
  const n=pts.length;if(!n)return '';
  if(n===1)return 'M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  const x=pts.map(p=>p[0]),y=pts.map(p=>p[1]),dx=[],m=[],t=new Array(n).fill(0);
  for(let i=0;i<n-1;i++){dx[i]=x[i+1]-x[i];m[i]=(y[i+1]-y[i])/dx[i]}
  t[0]=m[0];t[n-1]=m[n-2];
  for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){
    if(m[i]===0){t[i]=0;t[i+1]=0;continue}
    const a=t[i]/m[i],b=t[i+1]/m[i],q=a*a+b*b;
    if(q>9){const k=3/Math.sqrt(q);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}
  }
  let d='M'+x[0].toFixed(1)+' '+y[0].toFixed(1);
  for(let i=0;i<n-1;i++){
    const h=dx[i]/3;
    d+=' C'+(x[i]+h).toFixed(1)+' '+(y[i]+t[i]*h).toFixed(1)+' '+(x[i+1]-h).toFixed(1)+' '+(y[i+1]-t[i+1]*h).toFixed(1)+' '+x[i+1].toFixed(1)+' '+y[i+1].toFixed(1);
  }
  return d;
}

  const crTbl=`<div class="card"><div class="tbl-wrap"><table style="min-width:980px"><thead><tr>${['소재','광고비','노출','도달','클릭','클릭률','CPC','상세페이지 조회','장바구니','구매'].map(h=>`<th style="cursor:default">${h}</th>`).join('')}</tr></thead><tbody>${crRows.map(({c,a})=>`<tr><td class="nm"><div class="nmw"><img class="th" src="${c.img}" alt=""><div>${c.label}<small>${c.style} · ${c.full}</small></div></div></td><td class="num">${nf(a.cost)}원</td><td class="num">${nf(a.imp)}</td><td class="num">${reachTxt(a)}</td><td class="num">${nf(a.clk)}</td><td class="num">${f2(ctr(a))}%</td><td class="num">${nf(cpc(a))}원</td><td class="num">${nf(a.view)}</td><td class="num">${nf(a.cart)}</td><td class="num">${nf(a.buy)}건</td></tr>`).join('')}</tbody><tfoot><tr style="background:var(--bg2,#F2F4F6);font-weight:700"><td class="nm"><div>합계 · 평균<small>클릭률·CPC는 전체 기준 평균</small></div></td><td class="num">${nf(T.cost)}원</td><td class="num">${nf(T.imp)}</td><td class="num">${reachTxt(T)}</td><td class="num">${nf(T.clk)}</td><td class="num">${f2(ctr(T))}%</td><td class="num">${nf(cpc(T))}원</td><td class="num">${nf(T.view)}</td><td class="num">${nf(T.cart)}</td><td class="num">${nf(T.buy)}건</td></tr></tfoot></table></div>`;
  const grpNames=[...new Set(L.cr.map(c=>c.grp))];
  const gRows=grpNames.map(g=>{const cs=L.cr.filter(c=>c.grp===g);const a=sumRows(cs.flatMap(c=>rowsOf(c,sel.ds)),false);return {g,st:cs[0].style,names:cs.map(c=>c.label).join(' · '),a}});
  const gSpend=gRows.reduce((q,x)=>q+x.a.cost,0)||1;
  const abTbl=`<div class="card"><div class="tbl-wrap"><table style="min-width:820px"><thead><tr>${['구분','이미지 방향','광고비(비중)','노출','클릭률','CPC','상세페이지 조회율','장바구니','구매'].map(h=>`<th style="cursor:default">${h}</th>`).join('')}</tr></thead><tbody>${gRows.map(({g,st,names,a})=>`<tr><td class="nm"><div>${g}<small>${names}</small></div></td><td>${st}</td><td class="num">${nf(a.cost)}원 <span style="color:var(--ink3)">(${Math.round(a.cost/gSpend*100)}%)</span></td><td class="num">${nf(a.imp)}</td><td class="num">${f2(ctr(a))}%</td><td class="num">${nf(cpc(a))}원</td><td class="num">${f1(a.clk?a.view/a.clk*100:0)}%</td><td class="num">${nf(a.cart)}</td><td class="num">${nf(a.buy)}건</td></tr>`).join('')}</tbody></table></div><div style="font-size:12px;color:var(--ink3);margin-top:10px">나이아신은 당근(중고 플랫폼)에 맞춘 이미지, 펩타이드는 일반 제품 이미지로 넣은 테스트예요. 제품도 함께 달라서 이미지 효과만 따로 볼 수는 없어요.</div></div>`;
  document.getElementById('view').innerHTML=`
  <div class="hero"><div><h2>${b.name} <span style="color:var(--accent)">· 당근마켓 광고</span></h2><p>${b.sub} · 집행 시작 (2026.11.13)</p></div></div>
  ${segHtml}
  <div class="sec-t" style="margin-top:0">핵심 지표 <span>${sel.label} · 당근 데이터는 약 10분마다 갱신</span></div>
  <div class="kpis">
    ${kp('광고비',nf(T.cost),'원','VAT 포함',true)}
    ${kp('노출수',nf(T.imp),'회','')}
    ${kp('도달',T.reachOk?nf(T.reach):'–',T.reachOk?'명':'','')}
    ${kp('클릭수',nf(T.clk),'회','')}
    ${kp('클릭률',f2(ctr(T)),'%','클릭 ÷ 노출')}
    ${kp('CPC',nf(cpc(T)),'원','클릭당 비용')}
    ${kp('상세페이지 조회',nf(T.view),'회','클릭 대비 '+f1(T.clk?T.view/T.clk*100:0)+'%')}
    ${kp('장바구니',nf(T.cart),'회','')}
    ${kp('구매',nf(T.buy),'건','구매 금액 0원')}
    ${kp('일 예산',nf(L.budget),'원','운영 중 광고그룹 기준')}
  </div>
  <div class="sec-t">${OS.p==='all'||OS.p==='day'?'일별':OS.p==='week'?'주별':'월별'} 추이 <span>${OS.p==='all'?'일별로 전체 기간':'선택한 단위로 전체 기간'}</span></div>
  ${trend}
  <div class="sec-t">캠페인 · 광고그룹 현황</div>
  <div class="card"><div class="tbl-wrap"><table style="min-width:720px"><thead><tr>${['캠페인','광고그룹','상태','일 예산','광고비','노출','클릭'].map(h=>`<th style="cursor:default">${h}</th>`).join('')}</tr></thead><tbody><tr><td class="nm"><div>${L.camp.replace(/^캠페인_/,'')}</div></td><td class="nm"><div>${L.group.replace(/^광고그룹_앱\/웹사이트 방문 유도하기_네이티브 광고_/,'')}<small>${L.group}</small></div></td><td>${L.status}</td><td class="num">${nf(L.budget)}원</td><td class="num">${nf(m.cost)}원</td><td class="num">${nf(m.imp)}</td><td class="num">${nf(m.clk)}</td></tr></tbody></table></div></div>
  <div class="sec-t">소재별 현황 <span>${L.cr.length}개 소재 · ${sel.label}</span></div>
  ${crTbl}
  <div class="sec-t">이미지 방향 테스트 <span>당근 맞춤 이미지 vs 제품 이미지 · ${sel.label}</span></div>

  <div style="font-size:12px;color:var(--ink3);margin-top:10px">소재 이름·순서는 화면 캡처 기준으로 연결했어요. 도달은 중복 제외 수치라 하루 단위(그리고 전체)에서만 보여요. 주간·월간은 "–"이고, 11/16도 일별 캡처를 받기 전까지 "–"예요. 11/16은 누적값에서 계산한 오전분이라 내일 실제 값으로 교체할게요. 주별은 월~일 기준이에요.</div></div>
  <div id="issues"></div>
  <div id="notes"></div>`;
  document.getElementById('foot').innerHTML='<b>안내</b> · 당근마켓 광고관리자 기준 숫자예요(광고관리자 화면 캡처 기준). 비용은 VAT 포함이며, 구매 수·구매 금액은 당근이 집계한 값이라 실제 정산 매출과 다를 수 있어요.';
  document.querySelectorAll('#oseg button').forEach(x=>x.onclick=()=>{OS.p=x.dataset.g;OS.k=null;renderLive(b)});
  const os=document.getElementById('osel');if(os)os.onchange=()=>{OS.k=os.value;renderLive(b)};
  renderIssues();renderNotes();
}
function render(){
  if(BRANDS[S.brand].real){renderReal(BRANDS[S.brand]);return}
  if(BRANDS[S.brand].live){renderLive(BRANDS[S.brand]);return}
  setBanner(null);
  const b=BRANDS[S.brand], cr=allCreatives(b), N=S.period;
  const cur=sumRange(cr,DAYS-N,DAYS), prv=sumRange(cr,DAYS-2*N,DAYS-N);
  document.getElementById('asof').textContent=`기준일 ${dfull(END)} · 최근 ${N}일`;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.b===S.brand));
  const from=dateAt(DAYS-N), to=dateAt(DAYS-1);

  const kp=(l,v,u,dl,main)=>`<div class="kpi${main?' main':''}"><div class="l">${l}</div><div class="v num">${v}<em>${u}</em></div><div class="d num ${dl.c}">${dl.t} <span style="color:${main?'#8B95A1':'var(--ink3)'};font-weight:400">전기간 대비</span></div></div>`;
  const kpis=
    kp('광고비',nf(cur.spend),'원',delta(cur.spend,prv.spend))+
    kp('전환매출',nf(cur.rev),'원',delta(cur.rev,prv.rev))+
    kp('ROAS',f1(cur.roas),'%',delta(cur.roas,prv.roas),true)+
    kp(b.conv+' 전환수',nf(cur.conv),'건',delta(cur.conv,prv.conv))+
    kp('CPA',nf(cur.cpa),'원',delta(cur.cpa,prv.cpa))+
    kp('CTR',f2(cur.ctr),'%',ppDelta(cur.ctr,prv.ctr))+
    kp('CPC',nf(cur.cpc),'원',delta(cur.cpc,prv.cpc))+
    kp('CPM',nf(cur.cpm),'원',delta(cur.cpm,prv.cpm));

  const camps=b.campaigns.map(c=>({name:c.name,goal:c.goal,n:c.creatives.length,...sumRange(c.creatives,DAYS-N,DAYS)}));
  const crs=b.campaigns.flatMap(c=>c.creatives.map(x=>({name:x.name,fmt:x.fmt,camp:c.name,...sumRange([x],DAYS-N,DAYS)})));
  const avgRoas=cur.roas;
  const maxSpendC=Math.max(...camps.map(c=>c.spend));

  document.getElementById('view').innerHTML=`
  <div class="hero">
    <div><h2>${b.name} <span style="color:var(--accent)">· ${b.channel.split(' ')[0]}</span></h2><p>${b.sub} · ${md(from)} ~ ${md(to)}</p></div>
    <div class="seg" id="seg">${[7,14,30].map(n=>`<button data-n="${n}" class="${n===N?'on':''}">${n}일</button>`).join('')}</div>
  </div>

  <div class="kpis">${kpis}</div>

  <div class="sec-t">전환 퍼널 <span>노출 → 클릭 → ${b.conv}</span></div>
  <div class="card">
    <div class="funnel">
      <div class="st"><div class="l">노출수</div><div class="v num">${nf(cur.imp)}</div></div>
      <div class="ar">CTR<b class="num">${f2(cur.ctr)}%</b>→</div>
      <div class="st"><div class="l">클릭수</div><div class="v num">${nf(cur.clk)}</div></div>
      <div class="ar">CVR<b class="num">${f2(cur.cvr)}%</b>→</div>
      <div class="st"><div class="l">${b.conv} 전환</div><div class="v num">${nf(cur.conv)}</div></div>
    </div>
  </div>

  <div class="sec-t">일자별 추이 <span>점선은 직전 ${N}일</span></div>
  <div class="card">
    <div class="chips" id="chips">${METRICS.map(m=>`<button class="chip${m.k===S.metric?' on':''}" data-k="${m.k}">${m.l}</button>`).join('')}</div>
    <div class="chart-box" id="cb"><svg id="svg"></svg><div class="tt" id="tt"></div></div>
    <div class="legend"><span><i></i>최근 ${N}일</span><span><i class="p"></i>직전 ${N}일</span></div>
  </div>

  <div class="sec-t">캠페인별 성과 <span>열 제목을 누르면 정렬됩니다</span></div>
  <div class="card"><div class="tbl-wrap">${table('C',camps,[
    ['name','캠페인'],['spend','광고비'],['rev','전환매출'],['roas','ROAS'],['ctr','CTR'],['cpc','CPC'],['conv','전환'],['cpa','CPA']],S.sortC,maxSpendC,avgRoas)}</div></div>

  <div class="sec-t">소재별 성과 랭킹 <span>ROAS 기준 · 브랜드 평균 대비 판정</span></div>
  <div class="card"><div class="tbl-wrap">${table('X',crs,[
    ['name','소재'],['spend','광고비'],['roas','ROAS'],['ctr','CTR'],['cpc','CPC'],['conv','전환'],['cpa','CPA'],['judge','판정']],S.sortX,0,avgRoas)}</div></div>

  <div class="sec-t">자동 분석 인사이트 <span>데이터 기준 자동 생성</span></div>
  <div class="ins">${insights(b,cur,prv,camps,crs)}</div>

  <div id="issues"></div>
  <div id="notes"></div>`;

  document.getElementById('foot').innerHTML=`<b>지표 안내</b> · ROAS = 전환매출 ÷ 광고비 · CPA = 광고비 ÷ 전환수 · CTR = 클릭 ÷ 노출 · CVR = 전환 ÷ 클릭 · CPM = 1,000회 노출당 비용<br>색상은 증권 앱 관례를 따라 <span class="up">▲ 상승(빨강)</span> / <span class="down">▼ 하락(파랑)</span>으로 표시하며, 비용 지표의 상승·하락이 곧 좋고 나쁨을 뜻하지는 않습니다.<br>판정 기준: ROAS가 브랜드 평균의 115% 이상이면 <b>확대</b>, 70% 미만이면 <b>중단 검토</b>, 그 사이는 <b>유지</b>.`;

  bind(cr,N);
  drawChart(cr,N);
  renderIssues();renderNotes();
}

/* ============ 코멘트 구역 (링크 열람자는 읽기, 소유자는 작성 → 페이지에 저장) ============ */
let NOTES={};try{NOTES=JSON.parse(document.getElementById('notes-data').textContent||'{}')}catch(e){NOTES={}}
let AF=null, EDIT=false, DRAFT=null, MSG='', BUSY=false;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const blank=()=>({insight:'',good:'',bad:'',actions:[],updated:''});
const getNote=k=>Object.assign(blank(),NOTES[k]||{});
function fmtUpdated(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';return `${dfull(d)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 수정`}

function renderNotes(){
  const box=document.getElementById('notes');if(!box)return;
  const k=S.brand,n=EDIT&&DRAFT?DRAFT:getNote(k);
  const head=`<div class="nt-head"><div><h3>담당자 코멘트 · 다음 액션</h3><div class="meta">${esc(fmtUpdated(n.updated))||'아직 작성된 코멘트가 없습니다'}</div></div>
    <div>${EDIT?`<button class="btn sec" id="nt-cancel"${BUSY?' disabled':''}>취소</button> <button class="btn pri" id="nt-save"${BUSY?' disabled':''}>${BUSY?'저장 중…':'저장'}</button>`:(AF?`<button class="btn pri" id="nt-edit">코멘트 작성·수정</button>`:'')}</div></div>`;
  let body;
  if(EDIT){
    const ta=(id,tag,cls,t,ph,v,full)=>`<div class="nt${full?' full':''}"><h4><i class="${cls}">${tag}</i>${t}</h4><textarea id="${id}" placeholder="${ph}">${esc(v)}</textarea></div>`;
    body=`<div class="nt-grid">
      ${ta('f-insight','총평','a','핵심 인사이트','이번 기간 성과를 한눈에 요약해 주세요. 예) ROAS 상승 원인, 주목할 지표 변화',n.insight,true)}
      ${ta('f-good','효율 좋음','g','잘 된 소재','잘 된 소재와 이유 (훅, 포맷, 오퍼 등)',n.good)}
      ${ta('f-bad','개선 필요','w','아쉬운 소재','효율이 낮은 소재와 가설',n.bad)}
      <div class="nt full"><h4><i class="k">Next</i>다음 액션 아이템</h4>
        <div class="ar-list" id="ar-list">${n.actions.map((a,i)=>`<div class="ar-row" data-i="${i}">
          <input type="checkbox" class="a-done"${a.done?' checked':''}><input type="text" class="a-t" placeholder="액션 내용" value="${esc(a.t)}">
          <input type="text" class="a-o ow" placeholder="담당" value="${esc(a.owner)}"><input type="date" class="a-d" value="${esc(a.due)}"><button data-del="${i}" title="삭제">×</button></div>`).join('')}</div>
        <button class="btn sec" id="ar-add" style="margin-top:10px">+ 액션 추가</button></div></div>
      ${MSG?`<div class="nt-msg err">${esc(MSG)}</div>`:''}`;
  }else{
    const tx=v=>v&&v.trim()?`<div class="txt">${fmtTxt(v)}</div>`:'<div class="empty">작성된 내용이 없습니다.</div>';
    const acts=n.actions.length?`<div class="ar-list">${n.actions.map(a=>`<div class="ar-item${a.done?' done':''}"><div class="ck">${a.done?'✓':''}</div><div class="tx">${esc(a.t)}</div><div class="mt num">${esc(a.owner)}${a.owner&&a.due?' · ':''}${esc(a.due?a.due.slice(5).replace('-','/'):'')}</div></div>`).join('')}</div>`:'<div class="empty">등록된 액션이 없습니다.</div>';
    body=`<div class="nt-grid">
      <div class="nt full"><h4><i class="a">총평</i>핵심 인사이트</h4>${tx(n.insight)}</div>
      <div class="nt"><h4><i class="g">효율 좋음</i>잘 된 소재</h4>${tx(n.good)}</div>
      <div class="nt"><h4><i class="w">개선 필요</i>아쉬운 소재</h4>${tx(n.bad)}</div>
      <div class="nt full"><h4><i class="k">Next</i>다음 액션 아이템</h4>${acts}</div></div>
      ${MSG?`<div class="nt-msg">${esc(MSG)}</div>`:''}`;
  }
  box.innerHTML=head+body;
  const $=id=>document.getElementById(id);
  if($('nt-edit'))$('nt-edit').onclick=()=>{EDIT=true;DRAFT=JSON.parse(JSON.stringify(getNote(S.brand)));MSG='';renderNotes()};
  if($('nt-cancel'))$('nt-cancel').onclick=()=>{EDIT=false;DRAFT=null;MSG='';renderNotes()};
  if($('nt-save'))$('nt-save').onclick=saveNotes;
  if($('ar-add'))$('ar-add').onclick=()=>{collect();DRAFT.actions.push({t:'',owner:'',due:'',done:false});renderNotes()};
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{collect();DRAFT.actions.splice(+b.dataset.del,1);renderNotes()});
}
function collect(){
  const v=id=>{const e=document.getElementById(id);return e?e.value:''};
  DRAFT.insight=v('f-insight');DRAFT.good=v('f-good');DRAFT.bad=v('f-bad');
  DRAFT.actions=[...document.querySelectorAll('#ar-list .ar-row')].map(r=>({
    t:r.querySelector('.a-t').value,owner:r.querySelector('.a-o').value,due:r.querySelector('.a-d').value,done:r.querySelector('.a-done').checked}));
}
function buildHtml(){
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#view').innerHTML='';c.querySelector('#foot').innerHTML='';c.querySelector('#asof').textContent='';
  c.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  c.querySelector('#notes-data').textContent=JSON.stringify(NOTES).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
async function saveNotes(){
  collect();
  const note=Object.assign({},DRAFT,{actions:DRAFT.actions.filter(a=>a.t.trim()),updated:new Date().toISOString()});
  const prev=NOTES[S.brand];NOTES[S.brand]=note;BUSY=true;MSG='';renderNotes();
  try{
    await AF.publish(buildHtml());
    EDIT=false;DRAFT=null;BUSY=false;MSG='저장되었습니다.';renderNotes();
  }catch(e){
    NOTES[S.brand]=prev;DRAFT=note;BUSY=false;
    const code=(e&&(e.code||e.message))||'';
    MSG=/not_writer|not_granted/.test(code)?'작성 권한이 없습니다. 소유자 계정으로 로그인해 주세요.':'저장에 실패했습니다. 잠시 후 다시 시도해 주세요. ('+code+')';
    renderNotes();
  }
}

/* ============ 주요 이슈 로그 (소유자 작성 → 페이지에 저장, 링크 열람자는 읽기) ============ */
const ICATS=['소재 투입','소재 중단','예산·입찰','타겟·세트','세팅·오류','기타'];
let IEDIT=null,IBUSY=false,IMSG='',IDEL=null,IG='day';
function fmtTxt(v){return String(v||'').split('\n').filter(l=>l.trim()).map(l=>{const t=l.trim();if(/^\[.+\]$/.test(t))return `<div class="bh">${esc(t.slice(1,-1))}</div>`;if(t.startsWith('•'))return `<div class="bl"><span>•</span><span>${esc(t.replace(/^•\s*/,''))}</span></div>`;return `<div class="bp">${esc(t)}</div>`}).join('')}
const getIssues=k=>((NOTES.issues||{})[k]||[]).slice();
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtIssueDate(s){const d=new Date(s+'T00:00:00');if(isNaN(d))return s||'';return `${d.getMonth()+1}/${d.getDate()} (${'일월화수목금토'[d.getDay()]})`}
function renderIssues(){
  const box=document.getElementById('issues');if(!box)return;
  const k=S.brand;
  const list=getIssues(k).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||'').localeCompare(a.created||''));
  const head=`<div class="nt-head"><div><h3>주요 이슈 로그</h3><div class="meta">소재 투입·예산 변경 등 성과에 영향을 준 일을 날짜별로 기록해요${list.length?` · ${list.length}건`:''}</div></div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="seg" id="iseg">${[['day','일간'],['week','주간'],['month','월간']].map(x=>`<button data-g="${x[0]}" class="${x[0]===IG?'on':''}">${x[1]}</button>`).join('')}</div>${AF&&!IEDIT?`<button class="btn pri" id="is-new">+ 이슈 기록</button>`:''}</div></div>`;
  let form='';
  if(IEDIT){
    form=`<div class="nt is-form"><div class="row">
      <input type="date" id="is-date" value="${esc(IEDIT.date)}">
      <select id="is-cat">${ICATS.map(c=>`<option${c===IEDIT.cat?' selected':''}>${c}</option>`).join('')}</select>
      <input type="text" id="is-title" placeholder="무슨 일이 있었나요? 예) 신규 소재 2종 라이브" value="${esc(IEDIT.title)}"></div>
      <textarea id="is-memo" placeholder="자세한 내용 (소재명, 세트, 예산, 이유 등)">${esc(IEDIT.memo)}</textarea>
      ${IMSG?`<div class="nt-msg err">${esc(IMSG)}</div>`:''}
      <div class="bt"><button class="btn sec" id="is-cancel"${IBUSY?' disabled':''}>취소</button><button class="btn pri" id="is-save"${IBUSY?' disabled':''}>${IBUSY?'저장 중…':'저장'}</button></div></div>`;
  }
  const igKey=ds=>{if(!ds)return '미정';if(IG==='day')return ds;if(IG==='month')return ds.slice(0,7);const [y,mo,d]=ds.split('-').map(Number);const t=new Date(Date.UTC(y,mo-1,d));t.setUTCDate(t.getUTCDate()-((t.getUTCDay()+6)%7));return t.toISOString().slice(0,10)};
  const igLabel=kk=>{if(kk==='미정')return '날짜 미정';const [y,mo,d]=kk.split('-').map(Number);if(IG==='month')return mo+'월';const t=new Date(Date.UTC(y,mo-1,d));if(IG==='day')return fmtIssueDate(kk);const e=new Date(Date.UTC(y,mo-1,d+6));return (t.getUTCMonth()+1)+'/'+t.getUTCDate()+' ~ '+(e.getUTCMonth()+1)+'/'+e.getUTCDate()};
  const groups=[];list.forEach(it=>{const kk=igKey(it.date);let g=groups.find(x=>x.k===kk);if(!g){g={k:kk,items:[]};groups.push(g)}g.items.push(it)});
  const itemHtml=it=>{
    const ci=Math.max(0,ICATS.indexOf(it.cat));
    return `<div class="is-item">${IG==='day'?'':`<div class="is-d num">${esc(fmtIssueDate(it.date))}</div>`}
      <div class="is-b"><div class="is-t"><i class="c${ci}">${esc(it.cat||'기타')}</i>${esc(it.title)}</div>${it.memo&&it.memo.trim()?`<div class="txt">${fmtTxt(it.memo)}</div>`:''}${it.imgs&&it.imgs.length?`<div class="is-imgs">${it.imgs.filter(x=>IMG[x.k]).map(x=>`<div class="is-im"><img src="${IMG[x.k]}" alt="" title="${esc(x.cap||'')}"><span>${esc(x.cap||'')}</span></div>`).join('')}</div>`:''}</div>
      ${AF&&!IEDIT?`<div class="is-a"><button data-ie="${esc(it.id)}">수정</button><button data-id="${esc(it.id)}">${IDEL===it.id?'정말 삭제':'삭제'}</button></div>`:''}</div>`};
  const items=list.length?`<div class="is-list">${groups.map(g=>`<div class="is-grp">${esc(igLabel(g.k))}<em>${g.items.length}건</em></div>${g.items.map(itemHtml).join('')}`).join('')}</div>`
    :`<div class="nt"><div class="empty">기록된 이슈가 없습니다.</div></div>`;
  box.innerHTML=head+form+items+(!IEDIT&&IMSG?`<div class="nt-msg">${esc(IMSG)}</div>`:'');
  const $=id=>document.getElementById(id);
  box.querySelectorAll('#iseg button').forEach(x=>x.onclick=()=>{IG=x.dataset.g;renderIssues()});
  if($('is-new'))$('is-new').onclick=()=>{IEDIT={id:null,date:todayStr(),cat:ICATS[0],title:'',memo:''};IMSG='';IDEL=null;renderIssues()};
  if($('is-cancel'))$('is-cancel').onclick=()=>{IEDIT=null;IMSG='';renderIssues()};
  if($('is-save'))$('is-save').onclick=saveIssue;
  box.querySelectorAll('[data-ie]').forEach(b=>b.onclick=()=>{const it=getIssues(k).find(x=>x.id===b.dataset.ie);if(!it)return;IEDIT=Object.assign({memo:''},it);IMSG='';IDEL=null;renderIssues();const t=$('is-title');if(t)t.scrollIntoView({block:'center'})});
  box.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{
    if(IDEL!==b.dataset.id){IDEL=b.dataset.id;renderIssues();return}
    IDEL=null;persistIssues(getIssues(k).filter(x=>x.id!==b.dataset.id),()=>{IMSG='삭제했어요.'});
  });
}
async function persistIssues(next,onOk){
  const prevAll=NOTES.issues;
  NOTES.issues=Object.assign({},prevAll,{[S.brand]:next});
  IBUSY=true;IMSG='';renderIssues();
  try{
    await AF.publish(buildHtml());
    IBUSY=false;if(onOk)onOk();renderIssues();return true;
  }catch(e){
    NOTES.issues=prevAll;IBUSY=false;
    const code=(e&&(e.code||e.message))||'';
    IMSG=/not_writer|not_granted/.test(code)?'작성 권한이 없습니다. 소유자 계정으로 로그인해 주세요.':'저장에 실패했습니다. 잠시 후 다시 시도해 주세요. ('+code+')';
    renderIssues();return false;
  }
}
async function saveIssue(){
  const v=id=>{const e=document.getElementById(id);return e?e.value:''};
  IEDIT.date=v('is-date')||todayStr();IEDIT.cat=v('is-cat');IEDIT.title=v('is-title');IEDIT.memo=v('is-memo');
  if(!IEDIT.title.trim()){IMSG='제목을 입력해 주세요.';renderIssues();return}
  const k=S.brand,cur=getIssues(k),e=IEDIT;
  const rec={id:e.id||('i'+Date.now()),date:e.date,cat:e.cat,title:e.title.trim(),memo:e.memo.trim(),created:e.created||new Date().toISOString()};if(e.imgs&&e.imgs.length)rec.imgs=e.imgs;
  const next=e.id?cur.map(x=>x.id===e.id?rec:x):cur.concat(rec);
  const ok=await persistIssues(next,()=>{IEDIT=null;IMSG='저장되었습니다.'});
  if(!ok&&IEDIT){IEDIT.id=e.id}
}
try{if(window.claude&&claude.use)claude.use('artifact').then(a=>{if(a){AF=a;renderIssues();renderNotes()}}).catch(()=>{})}catch(e){}

function judge(roas,avg){return roas>=avg*1.15?['확대','s']:roas<avg*0.7?['중단 검토','x']:['유지','h']}

function table(id,rows,cols,sort,maxSpend,avgRoas){
  const val=(r,k)=>k==='judge'?r.roas:k==='name'?r.name:r[k];
  const sorted=rows.slice().sort((a,b)=>{const x=val(a,sort.key),y=val(b,sort.key);return(typeof x==='string'?x.localeCompare(y,'ko'):x-y)*sort.dir});
  const head=cols.map(([k,l])=>`<th data-t="${id}" data-k="${k}" class="${sort.key===k?'on':''}">${l}<span class="ar">${sort.key===k?(sort.dir<0?'▼':'▲'):''}</span></th>`).join('');
  const body=sorted.map((r,i)=>{
    const rn=id==='X'?`<span class="rk${i<3?' t':''}">${i+1}</span>`:'';
    const sub=id==='C'?`<small>${r.goal} · 소재 ${r.n}개</small>`:`<small>${r.fmt} · ${r.camp.replace(/^\[[^\]]+\]\s*/,'')}</small>`;
    const j=judge(r.roas,avgRoas);
    return `<tr><td class="nm">${rn}${r.name}${sub}</td>
      <td class="num">${id==='C'?`<span class="minibar" style="width:${Math.max(4,r.spend/maxSpend*44)}px"></span>`:''}${nf(r.spend)}원</td>
      ${id==='C'?`<td class="num">${nf(r.rev)}원</td>`:''}
      <td class="num"><b>${f1(r.roas)}%</b></td><td class="num">${f2(r.ctr)}%</td><td class="num">${nf(r.cpc)}원</td>
      <td class="num">${nf(r.conv)}건</td><td class="num">${r.conv?nf(r.cpa)+'원':'–'}</td>
      ${id==='X'?`<td><span class="bd ${j[1]}">${j[0]}</span></td>`:''}</tr>`}).join('');
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function insights(b,cur,prv,camps,crs){
  const out=[];
  const best=crs.slice().sort((a,b)=>b.roas-a.roas)[0], worst=crs.filter(c=>c.spend>0).sort((a,b)=>a.roas-b.roas)[0];
  const bc=camps.slice().sort((a,b)=>b.roas-a.roas)[0];
  const rd=delta(cur.roas,prv.roas), sd=delta(cur.spend,prv.spend);
  out.push(`<div class="in"><span class="tag">전체 흐름</span><h4>ROAS ${f1(cur.roas)}%, 전기간 대비 ${rd.t.replace(/[▲▼] /,'')} ${rd.c==='up'?'상승':rd.c==='down'?'하락':'동일'}</h4><p>광고비는 ${nf(cur.spend)}원으로 ${sd.t.replace(/[▲▼] /,'')} ${sd.c==='up'?'증가':sd.c==='down'?'감소':'변동 없음'}했고, ${b.conv} ${nf(cur.conv)}건을 CPA ${nf(cur.cpa)}원에 확보했습니다.</p></div>`);
  out.push(`<div class="in"><span class="tag">확대 후보</span><h4>${best.name}</h4><p>ROAS ${f1(best.roas)}%로 브랜드 평균의 ${f1(best.roas/cur.roas*100)}% 수준입니다. 캠페인 중에서는 「${bc.name.replace(/^\[[^\]]+\]\s*/,'')}」이 ROAS ${f1(bc.roas)}%로 가장 높습니다.</p></div>`);
  out.push(`<div class="in"><span class="tag">점검 필요</span><h4>${worst.name}</h4><p>ROAS ${f1(worst.roas)}%, CPA ${worst.conv?nf(worst.cpa)+'원':'집계 없음'}. 소재 교체 또는 예산 이동을 검토할 수 있습니다.</p></div>`);
  return out.join('');
}

/* ============ 인터랙션 ============ */
function bind(cr,N){
  document.querySelectorAll('#seg button').forEach(el=>el.onclick=()=>{S.period=+el.dataset.n;render()});
  document.querySelectorAll('#chips .chip').forEach(el=>el.onclick=()=>{S.metric=el.dataset.k;document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('on',c===el));drawChart(cr,N)});
  document.querySelectorAll('th[data-t]').forEach(el=>el.onclick=()=>{
    const st=el.dataset.t==='C'?S.sortC:S.sortX,k=el.dataset.k;
    if(st.key===k)st.dir*=-1;else{st.key=k;st.dir=(k==='name'||k==='cpa'||k==='cpc')?1:-1}
    render()});
}
function drawChart(cr,N){
  const m=METRICS.find(x=>x.k===S.metric), svg=document.getElementById('svg'), box=document.getElementById('cb'), tt=document.getElementById('tt');
  const W=box.clientWidth||680,H=260,pl=52,pr=8,pt=12,pb=26;
  const cur=[],prv=[];
  for(let i=0;i<N;i++){cur.push(m.g(dayAgg(cr,DAYS-N+i)));prv.push(m.g(dayAgg(cr,DAYS-2*N+i)))}
  const all=cur.concat(prv);let mx=Math.max(...all),mn=Math.min(...all);
  const isRatio=(m.k==='roas'||m.k==='cpa');
  if(isRatio){const pad=(mx-mn)*.15||1;mx+=pad;mn=Math.max(0,mn-pad)}else{mn=0;mx*=1.12}
  const X=i=>pl+(N===1?0:i/(N-1))*(W-pl-pr), Y=v=>pt+(1-(v-mn)/(mx-mn||1))*(H-pt-pb);
  const path=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  let g='';
  for(let t=0;t<=4;t++){const v=mn+(mx-mn)*t/4,y=Y(v);
    const lab=v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e4?Math.round(v/1e3)+'K':Math.round(v);
    g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#EEF0F3"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#8B95A1">${lab}${m.k==='roas'?'%':''}</text>`}
  const step=Math.max(1,Math.ceil(N/7));
  for(let i=0;i<N;i+=step){g+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="#8B95A1">${md(dateAt(DAYS-N+i))}</text>`}
  const area=path(cur)+` L${X(N-1)} ${H-pb} L${X(0)} ${H-pb} Z`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML=`<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6007E" stop-opacity=".16"/><stop offset="1" stop-color="#E6007E" stop-opacity="0"/></linearGradient></defs>${g}
    <path d="${area}" fill="url(#gr)"/>
    <path d="${path(prv)}" fill="none" stroke="#B0B8C1" stroke-width="2" stroke-dasharray="4 4" stroke-linejoin="round"/>
    <path d="${path(cur)}" fill="none" stroke="#E6007E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="gl" y1="${pt}" y2="${H-pb}" stroke="#CBD1D8" opacity="0"/><circle id="gd" r="5" fill="#E6007E" stroke="#fff" stroke-width="2" opacity="0"/>
    <rect x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent" id="hit"/>`;
  const gl=svg.querySelector('#gl'),gd=svg.querySelector('#gd'),hit=svg.querySelector('#hit');
  function move(ev){
    const r=svg.getBoundingClientRect(),cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
    const i=Math.max(0,Math.min(N-1,Math.round((cx-pl)/((W-pl-pr)/(N-1||1)))));
    gl.setAttribute('x1',X(i));gl.setAttribute('x2',X(i));gl.setAttribute('opacity',1);
    gd.setAttribute('cx',X(i));gd.setAttribute('cy',Y(cur[i]));gd.setAttribute('opacity',1);
    tt.innerHTML=`<b>${dfull(dateAt(DAYS-N+i))}</b>${m.l} ${m.f(cur[i])}<br><span style="color:#AEB5BE">직전 ${m.f(prv[i])}</span>`;
    tt.style.left=Math.max(70,Math.min(W-70,X(i)))+'px';tt.style.top=(Y(cur[i])-12)+'px';tt.style.opacity=1}
  function leave(){gl.setAttribute('opacity',0);gd.setAttribute('opacity',0);tt.style.opacity=0}
  hit.addEventListener('mousemove',move);hit.addEventListener('mouseleave',leave);
  hit.addEventListener('touchstart',move,{passive:true});hit.addEventListener('touchmove',move,{passive:true});hit.addEventListener('touchend',leave);
}

/* 탭 + 해시 라우팅 (#lume / #onsal) */
function fromHash(){const h=location.hash.slice(1);if(BRANDS[h])S.brand=h}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{S.brand=t.dataset.b;try{history.replaceState(null,'','#'+S.brand)}catch(e){location.hash=S.brand}render();window.scrollTo(0,0)});
window.addEventListener('hashchange',()=>{fromHash();render()});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(BRANDS[S.brand].real){drawDaily();return}if(BRANDS[S.brand].live)return;const cr=allCreatives(BRANDS[S.brand]);drawChart(cr,S.period)},120)});
fromHash();render();
</script>
